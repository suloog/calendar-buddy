[package]
name = "calendar-buddy"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calendar-core = { version = "0.1.0", path = "../core" }
calendar-google = { version = "0.1.0", path = "../google" }
chrono = "0.4.45"
chrono-tz = "0.10.4"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
# The lock and tick marks are in egui's emoji fonts, left out of its default fonts.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
iana-time-zone = "0.1.65"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }
zbus = "5.19.0"

[dev-dependencies]
calendar-google = { version = "0.1.0", path = "../google", features = ["fake"] }
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }
serde_json = "1.0.154"
