[package]
name = "calendar-buddy"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
calendar-core = { version = "0.1.0", path = "../core" }
calendar-google = { version = "0.1.0", path = "../google" }
chrono = "0.4.45"
chrono-tz = "0.10.4"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
# The lock and tick marks are in egui's emoji fonts, left out of its default fonts.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
iana-time-zone = "0.1.65"

# The desktop on Linux: the Secret Service, the session and system buses and the tray.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
secret-service = { version = "5.2.0", features = ["rt-async-io-crypto-rust"] }
zbus = "5.19.0"

# The system on macOS: the Keychain, where the tokens are kept (`DEC-47`), and through AppKit the
# menu bar and the notifications (`DEC-218`).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSBundle", "NSData", "NSError", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSSet", "NSString"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
security-framework = "3.7.0"

[dev-dependencies]
calendar-google = { version = "0.1.0", path = "../google", features = ["fake"] }
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot", "eframe"] }
serde_json = "1.0.154"
