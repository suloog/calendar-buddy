[package]
name = "calendar-core"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["unstable-locales"] }
chrono-tz = "0.10.4"
pure-rust-locales = "0.8.2"
rrule = "0.14"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1.0.154"
# Asking Ollama whether it runs and has the model (`MOD-10`, `DEC-216`).
ureq = "3.5.0"
url = "2.5.8"

[features]
# The fake Ollama, for the tests of the crates that use this one.
fake = []
